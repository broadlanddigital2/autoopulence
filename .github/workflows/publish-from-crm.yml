# Rebuilds the website with the page fixes made in the CRM (SEO optimiser / Google Ads optimiser → Apply) and commits
# the regenerated dist/ — Cloudflare then deploys it. Runs hourly and on demand (Actions → Publish from CRM → Run workflow).
name: Publish from CRM
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [crm-publish]
permissions:
  contents: write
concurrency:
  group: publish-from-crm
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch CRM page fixes and build site
        run: npm run rebuild
      - name: Tell Bing (ChatGPT search) and other IndexNow engines about new or changed pages
        working-directory: tools/static-export
        run: |
          node ai-visibility.mjs prepare
          if [ -s gen-indexnow.json ] && ! node ai-visibility.mjs submit; then
            echo "IndexNow refused the list; keeping the previous state so these pages are sent next time"
            git checkout -- indexnow-state.json 2>/dev/null || rm -f indexnow-state.json
          fi
      - name: Commit if anything changed
        run: |
          git config user.name "ao-crm-publisher"
          git config user.email "publisher@autoopulence.co.uk"
          # dist/ is the website and worker/dist/ the Worker built from worker/src (both deployed by Cloudflare).
          git add -A dist worker/dist source/lib/crm
          if [ -f tools/static-export/indexnow-state.json ]; then git add tools/static-export/indexnow-state.json; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Publish from CRM ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase --autostash
          git push
